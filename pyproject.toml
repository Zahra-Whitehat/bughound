[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bughound"
version = "0.6.2"
description = "Authorized web vulnerability hunting agent: scans a domain, verifies findings, and writes reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bughound contributors" }]
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.9"]

[project.scripts]
bughound = "bughound.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bughound*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
